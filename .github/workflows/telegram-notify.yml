name: Telegram push notification

on:
  push:
    branches: ['**']
    tags-ignore: ['**']

jobs:
  notify:
    # A branch deletion carries no diff worth reporting.
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so `github.event.before` exists locally and a real diff is possible.
          fetch-depth: 0

      - name: Send Telegram message
        env:
          # Every value the script reads arrives through env, never through
          # ${{ }} inside the script body: a branch name or commit message
          # containing $(...) would otherwise run as a command on the runner.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          REPO_NAME: ${{ github.event.repository.name }}
          COMPARE_URL: ${{ github.event.compare }}
          HEAD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::notice::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not set - skipping notification."
            exit 0
          fi

          # Telegram HTML mode needs only these three escaped, unlike MarkdownV2.
          esc() { sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'; }

          ZERO=0000000000000000000000000000000000000000

          # A real git diff beats github.event.commits[], which caps at 20
          # commits and goes stale on a force-push.
          if [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # New branch, or the old tip is gone (force-push / GC).
            CHANGES=$(git show --name-status --format= "$AFTER" || true)
            COMMITS=1
          else
            CHANGES=$(git diff --name-status "$BEFORE" "$AFTER" || true)
            COMMITS=$(git rev-list --count "${BEFORE}..${AFTER}")
          fi

          TOTAL=$(printf '%s\n' "$CHANGES" | grep -c . || true)
          MAX=25

          # --name-status prints "STATUS<TAB>PATH", or "R100<TAB>old<TAB>new" for renames.
          FILE_LINES=$(printf '%s\n' "$CHANGES" | grep . | sed -n "1,${MAX}p" | awk -F'\t' '
            { s = substr($1, 1, 1)
              if (NF > 2) printf "  %s  %s -> %s\n", s, $2, $3
              else        printf "  %s  %s\n", s, $2 }' || true)

          if [ "$TOTAL" -gt "$MAX" ]; then
            FILE_LINES=$(printf '%s\n  ... and %d more' "$FILE_LINES" "$((TOTAL - MAX))")
          fi
          [ -n "$FILE_LINES" ] || FILE_LINES="  (no file changes)"

          # Cambodia local time, from the newest commit in the push. GNU date
          # parses the ISO-8601 payload timestamp; fall back to "now" rather
          # than letting `set -e` kill the notification over a format hiccup.
          WHEN=$(TZ='Asia/Phnom_Penh' date -d "${HEAD_TIMESTAMP:-now}" '+%Y-%m-%d %H:%M:%S %Z' 2>/dev/null \
            || TZ='Asia/Phnom_Penh' date '+%Y-%m-%d %H:%M:%S %Z')

          BRANCH_E=$(printf '%s' "$BRANCH"    | esc)
          ACTOR_E=$(printf '%s'  "$ACTOR"     | esc)
          REPO_E=$(printf '%s'   "$REPO_NAME" | esc)
          SUBJECT_E=$(printf '%s\n' "$HEAD_MESSAGE" | sed -n '1p' | esc)
          FILES_E=$(printf '%s' "$FILE_LINES" | esc)

          # Telegram caps a message at 4096 characters. The file block is the
          # only part that can grow, so bound it and leave the frame intact.
          if [ ${#FILES_E} -gt 3000 ]; then
            FILES_E=$(printf '%s\n  ... (truncated)' "${FILES_E:0:3000}")
          fi

          BY="$ACTOR_E"
          if [ -n "$AUTHOR" ] && [ "$AUTHOR" != "$ACTOR" ]; then
            BY=$(printf '%s (authored by %s)' "$ACTOR_E" "$(printf '%s' "$AUTHOR" | esc)")
          fi

          FILE_WORD="files"
          [ "$TOTAL" = "1" ] && FILE_WORD="file"

          MESSAGE=$(printf '%s\n' \
            "🚀 <b>Push to ${REPO_E}</b>" \
            "" \
            "<b>Branch:</b>  <code>${BRANCH_E}</code>" \
            "<b>By:</b>      ${BY}" \
            "<b>Time:</b>    ${WHEN}" \
            "<b>Commits:</b> ${COMMITS} — ${SUBJECT_E}" \
            "" \
            "<b>Changes</b> (${TOTAL} ${FILE_WORD})" \
            "<pre>${FILES_E}</pre>" \
            "" \
            "<a href=\"${COMPARE_URL}\">View diff on GitHub</a>")

          jq -n --arg chat "$TELEGRAM_CHAT_ID" --arg text "$MESSAGE" \
            '{chat_id: $chat, text: $text, parse_mode: "HTML", disable_web_page_preview: true}' \
            > payload.json

          RESPONSE=$(curl -sS -X POST \
            -H 'Content-Type: application/json' \
            -d @payload.json \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage")

          # Telegram answers HTTP 200 with {"ok":false,...} on a bad chat id, so
          # a silent failure has to be turned into a red run explicitly.
          if [ "$(printf '%s' "$RESPONSE" | jq -r '.ok')" != "true" ]; then
            echo "Telegram rejected the message:"
            printf '%s\n' "$RESPONSE"
            exit 1
          fi

          echo "Notification sent."
